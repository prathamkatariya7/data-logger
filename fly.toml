# Fly.io config (https://fly.io) — always-on VM with a free persistent volume.
# Fly's free allowance covers a small always-on machine + a 3GB volume, which
# fits this logger and keeps your data across restarts. Run `fly launch` to
# adopt this file, then `fly deploy`.  (Change `app` to a globally-unique name.)

app = "data-logger-CHANGE-ME"
primary_region = "sin"   # Singapore — closest Fly region to India

[build]
  dockerfile = "Dockerfile"

[env]
  DB_PATH = "/data/data_logger.db"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false     # keep it running so ingest never misses data
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "data"                # `fly volumes create data --size 1`
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
